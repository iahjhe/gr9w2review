<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math 9 · Quadratic Functions Review</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#14213d;--mute:#5b6678;--line:#cfd8e6;--acc:#2457c5;--ok:#1b7f4b;--okbg:#e3f4ea;--bad:#b3261e;--badbg:#fbe6e4}
@media(prefers-color-scheme:dark){:root{--bg:#0f1624;--card:#18223a;--ink:#e8edf7;--mute:#9aa7bd;--line:#2f3d5c;--acc:#7ea6ff;--ok:#5fd394;--okbg:#14352a;--bad:#ff8f86;--badbg:#3b1d1f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;background-attachment:fixed}
main{max-width:760px;margin:0 auto;padding:20px 14px 60px}
header{background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:18px 20px;margin-bottom:18px}
h1{font:700 1.7rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
header p{margin:0;color:var(--mute)}
section{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px;margin-bottom:18px}
h2{font:700 1.15rem Georgia,serif;margin:0 0 4px}
.dir{color:var(--mute);margin:0 0 14px;font-size:.92rem}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.q p{margin:0 0 6px;font-weight:600}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
@media(max-width:520px){.opts{grid-template-columns:1fr}}
.opts label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:5px;padding:7px 10px;cursor:pointer}
.opts label:hover{border-color:var(--acc)}
.opts input{accent-color:var(--acc)}
.ok{background:var(--okbg);border-color:var(--ok)!important}
.no{background:var(--badbg);border-color:var(--bad)!important}
input[type=text],select{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:6px 8px;width:100%}
input[type=text]:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
table{border-collapse:collapse;margin:8px 0}
td,th{border:1px solid var(--line);padding:6px 12px;text-align:center}
th{background:var(--bg)}
.diffs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.diffs input{width:62px;text-align:center}
.diffs span{font-size:.9rem;color:var(--mute);min-width:112px}
.grid2{display:grid;grid-template-columns:150px 1fr;gap:8px;align-items:center}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.fb{font-size:.88rem;margin-top:4px;color:var(--bad)}
.fb.g{color:var(--ok)}
svg{width:100%;max-width:380px;height:auto;display:block;margin:8px 0;background:var(--card);border:1px solid var(--line)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;bottom:0;background:var(--card);border:2px solid var(--ink);border-radius:6px;padding:12px 16px}
button{font:inherit;font-weight:700;border:2px solid var(--ink);background:var(--acc);color:#fff;border-radius:5px;padding:8px 18px;cursor:pointer}
button.alt{background:transparent;color:var(--ink)}
#score{font:700 1.1rem Georgia,serif;margin-left:auto}
@media(prefers-reduced-motion:no-preference){button{transition:transform .1s}button:active{transform:translateY(1px)}}
</style>
</head>
<body>
<main>
<header>
<h1>Quadratic Functions Review</h1>
<p>Mathematics 9 · Practice quiz · 35 points</p>
</header>
<div id="app"></div>
<div class="bar"><button id="chk">Check answers</button><button id="rst" class="alt">New attempt</button><span id="score"></span></div>
</main>
<script>
const $=(s,r=document)=>r.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nums=s=>(String(s).replace(/−|–/g,'-').match(/-?\d+(\.\d+)?/g)||[]).map(Number);
const flat=s=>String(s).toLowerCase().replace(/−|–/g,'-').replace(/\s+/g,'');
const same=(a,b)=>a.length===b.length&&[...a].sort((x,y)=>x-y).join()===[...b].sort((x,y)=>x-y).join();

/* ---------- Part A ---------- */
const A=[
["Which situation can be modeled by a quadratic function?","Area of a square garden as its side length changes",["Cost of buying notebooks at ₱25 each","Distance covered at a constant speed of 60 km/h","Number of chairs for each table of 6"]],
["Expand y = (x + 3)².","x² + 6x + 9",["x² + 9","x² + 3x + 9","x² − 6x + 9"]],
["Convert y = (x − 2)² + 5 to general form.","x² − 4x + 9",["x² + 4x + 9","x² − 4x + 5","x² − 2x + 7"]],
["The general form of y = (x + 1)² − 6 is","x² + 2x − 5",["x² + 2x − 6","x² + x − 5","x² + 2x + 7"]],
["Changing the value of a in y = a(x − h)² + k affects the","width and opening direction",["x-coordinate of the vertex","y-coordinate of the vertex","location of the axis of symmetry only"]],
["If a > 0, the parabola opens","upward",["downward","to the left","to the right"]],
["Compared with y = x², the graph of y = 3x² is","narrower",["wider","lower","shifted to the right"]],
["The graph of y = −½(x − 3)² + 2 opens","downward",["upward","to the left","to the right"]],
["If −1 < a < 0, the graph becomes","wider and opens downward",["narrower and opens downward","wider and opens upward","narrower and opens upward"]],
["Which statement is TRUE when only h changes?","The graph shifts left or right.",["The graph shifts up or down.","The parabola becomes narrower.","The parabola flips to open downward."]],
["Which of the following changes the y-coordinate of the vertex?","Changing k",["Changing h","Changing a only","None of these"]],
["Compared to y = x², the graph of y = x² + 6 is","6 units up",["6 units down","6 units left","6 units right"]],
["Which statement is TRUE when only a changes (a ≠ 0)?","The width or direction changes, but the vertex stays put.",["The graph moves left or right.","The graph moves up or down.","The vertex moves along the axis of symmetry."]],
["If k changes from 1 to −6, the graph moves","7 units downward",["5 units downward","7 units upward","6 units to the left"]],
["Which function is the graph of y = x² translated 5 units to the left?","y = (x + 5)²",["y = (x − 5)²","y = x² + 5","y = x² − 5"]]
];

/* ---------- Part B ---------- */
const B=[
{xs:[-1,0,1,2,3],f:x=>x*x-3*x},
{xs:[-2,-1,0,1,2],f:x=>-3*x+2}
];

/* ---------- Part C (graph of y=(x+1)^2-4) ---------- */
const C=[
["Concavity","opens upward",v=>/up/i.test(v)],
["Vertex","(−1, −4)",v=>same(nums(v),[-1,-4])&&nums(v)[0]===-1],
["Axis of symmetry","x = −1",v=>flat(v)==="x=-1"],
["Minimum / maximum value","minimum value of −4",v=>nums(v).includes(-4)&&!/max/i.test(v)],
["x-intercepts","−3 and 1",v=>same(nums(v),[-3,1])],
["y-intercept","−3",v=>nums(v).slice(-1)[0]===-3&&nums(v).length<=2],
["Domain","all real numbers",v=>/all real|real number|ℝ|∞|inf|x∈|x in r/i.test(v)],
["Range","y ≥ −4",v=>nums(v).includes(-4)&&!/≤|<=|less|below|max/i.test(v)]
];
const graphC=x=>(x+1)**2-4;

/* ---------- Part E ---------- */
const E=[
{label:"f(x) = x² + 2x − 15",fn:x=>x*x+2*x-15,vx:[-1,-16],xi:[-5,3],yi:-15,win:[-8,6,-18,6]},
{label:"f(x) = −3(x − 1)²",fn:x=>-3*(x-1)**2,vx:[1,0],xi:[1],yi:-3,win:[-3,5,-12,3]}
];

/* ---------- Plot helper ---------- */
function plot(fn,[x0,x1,y0,y1],pts=[]){
 const W=380,H=330,m=26,sx=(W-2*m)/(x1-x0),sy=(H-2*m)/(y1-y0);
 const X=x=>m+(x-x0)*sx,Y=y=>H-m-(y-y0)*sy;
 const step=Math.max(1,Math.round((y1-y0)/12));
 let g='';
 for(let x=Math.ceil(x0);x<=x1;x++)g+=`<line x1="${X(x)}" y1="${Y(y0)}" x2="${X(x)}" y2="${Y(y1)}" stroke="currentColor" opacity=".13"/>`;
 for(let y=Math.ceil(y0);y<=y1;y+=1)g+=`<line x1="${X(x0)}" y1="${Y(y)}" x2="${X(x1)}" y2="${Y(y)}" stroke="currentColor" opacity=".13"/>`;
 g+=`<line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1)}" stroke="currentColor" stroke-width="1.6"/><line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1)}" y2="${Y(0)}" stroke="currentColor" stroke-width="1.6"/>`;
 for(let x=Math.ceil(x0);x<=x1;x++)if(x)g+=`<text x="${X(x)}" y="${Y(0)+13}" font-size="10" text-anchor="middle" fill="currentColor">${x}</text>`;
 for(let y=Math.ceil(y0);y<=y1;y++)if(y&&(y%step===0))g+=`<text x="${X(0)-4}" y="${Y(y)+3}" font-size="10" text-anchor="end" fill="currentColor">${y}</text>`;
 let d='',pen=false;
 for(let x=x0;x<=x1+1e-9;x+=.05){const y=fn(x);if(y<y0||y>y1){pen=false;continue}d+=(pen?'L':'M')+X(x).toFixed(1)+' '+Y(y).toFixed(1);pen=true}
 g+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3"/>`;
 pts.forEach(p=>g+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="var(--bad)"/>`);
 return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="graph">${g}</svg>`;
}

/* ---------- Render ---------- */
function build(){
 let h='';
 h+=`<section><h2>A. Multiple choice</h2><p class="dir">Pick the best answer. 15 points.</p>`;
 A.forEach((q,i)=>{
  const opts=shuffle([q[1],...q[2]]);
  h+=`<div class="q" data-i="${i}"><p>${i+1}. ${q[0]}</p><div class="opts">`+opts.map(o=>`<label><input type="radio" name="a${i}" value="${o.replace(/"/g,'&quot;')}"><span>${o}</span></label>`).join('')+`</div><div class="fb"></div></div>`;
 });
 h+=`</section><section><h2>B. Quadratic or linear?</h2><p class="dir">Fill in the first and second differences, then decide. 2 points.</p>`;
 B.forEach((t,k)=>{
  const ys=t.xs.map(t.f);
  h+=`<div class="q" data-k="${k}"><table><tr><th>x</th>${t.xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>f(x)</th>${ys.map(y=>`<td>${y}</td>`).join('')}</tr></table>
  <div class="diffs"><span>First differences</span>${[0,1,2,3].map(i=>`<input type="text" inputmode="numeric" data-d1="${i}" aria-label="first difference ${i+1}">`).join('')}</div>
  <div class="diffs"><span>Second differences</span>${[0,1,2].map(i=>`<input type="text" inputmode="numeric" data-d2="${i}" aria-label="second difference ${i+1}">`).join('')}</div>
  <select data-type><option value="">Table ${k+1} is…</option><option value="q">quadratic</option><option value="l">linear</option></select><div class="fb"></div></div>`;
 });
 h+=`</section><section><h2>C. Interpret the graph</h2><p class="dir">Study the graph and describe each feature. 8 points.</p>${plot(graphC,[-5,3,-5,5])}<div class="grid2">`;
 C.forEach((c,i)=>{h+=`<label for="c${i}">${i+1}. ${c[0]}</label><div><input type="text" id="c${i}" data-c="${i}" autocomplete="off"><div class="fb"></div></div>`});
 h+=`</div></section><section><h2>D. Vertex, intercepts, and sketch</h2><p class="dir">Find the vertex, x-intercept(s), and y-intercept. Write points like (2, 5) and separate several x-intercepts with commas. 5 points each. The sketch appears when you check.</p>`;
 E.forEach((e,i)=>{
  h+=`<div class="q" data-e="${i}"><p>${i+1}. ${e.label}</p><div class="grid2">
  <label>Vertex</label><input type="text" data-ev autocomplete="off">
  <label>x-intercept(s)</label><input type="text" data-ex autocomplete="off">
  <label>y-intercept</label><input type="text" data-ey autocomplete="off"></div><div class="fb"></div><div class="sk"></div></div>`;
 });
 h+=`</section>`;
 $('#app').innerHTML=h;$('#score').textContent='';$('#chk').disabled=false;
}

function mark(el,ok,msg){const fb=el.querySelector('.fb');fb.textContent=msg||'';fb.className='fb'+(ok?' g':'')}

function check(){
 let total=0;
 // A
 A.forEach((q,i)=>{
  const box=$(`.q[data-i="${i}"]`),sel=box.querySelector('input:checked');
  box.querySelectorAll('label').forEach(l=>{const v=l.querySelector('input').value;l.classList.remove('ok','no');if(v===q[1])l.classList.add('ok');else if(l.querySelector('input').checked)l.classList.add('no')});
  if(sel&&sel.value===q[1]){total++;mark(box,true,'')}else mark(box,false,sel?'Correct answer: '+q[1]:'Not answered. Correct answer: '+q[1]);
  box.querySelectorAll('input').forEach(x=>x.disabled=true);
 });
 // B
 B.forEach((t,k)=>{
  const box=$(`.q[data-k="${k}"]`),ys=t.xs.map(t.f);
  const d1=ys.slice(1).map((y,i)=>y-ys[i]),d2=d1.slice(1).map((y,i)=>y-d1[i]);
  let okd=true;
  box.querySelectorAll('[data-d1]').forEach(inp=>{const ok=nums(inp.value)[0]===d1[+inp.dataset.d1];inp.style.borderColor=ok?'var(--ok)':'var(--bad)';okd=okd&&ok});
  box.querySelectorAll('[data-d2]').forEach(inp=>{const ok=nums(inp.value)[0]===d2[+inp.dataset.d2];inp.style.borderColor=ok?'var(--ok)':'var(--bad)';okd=okd&&ok});
  const type=d2.every(v=>v===0)?'l':'q',s=box.querySelector('select');
  const ok=s.value===type;if(ok)total++;s.disabled=true;
  mark(box,ok&&okd,(ok?'Right call. ':'Not quite. ')+`First differences: ${d1.join(', ')}. Second differences: ${d2.join(', ')}. It is ${type==='q'?'quadratic (second differences are constant and not zero)':'linear (first differences are constant)'}.`);
 });
 // C
 C.forEach((c,i)=>{
  const inp=$(`[data-c="${i}"]`),box=inp.parentElement,ok=c[2](inp.value);
  if(ok)total++;inp.disabled=true;inp.style.borderColor=ok?'var(--ok)':'var(--bad)';
  mark(box,ok,ok?'':'Expected: '+c[1]);
 });
 // E
 E.forEach((e,i)=>{
  const box=$(`.q[data-e="${i}"]`);let pts=0,bad=[];
  const v=box.querySelector('[data-ev]'),x=box.querySelector('[data-ex]'),y=box.querySelector('[data-ey]');
  const vo=nums(v.value).length===2&&nums(v.value)[0]===e.vx[0]&&nums(v.value)[1]===e.vx[1];
  const xo=same([...new Set(nums(x.value))],e.xi);
  const yn=nums(y.value),yo=yn.length&&yn[yn.length-1]===e.yi&&yn.length<=2;
  [[v,vo],[x,xo],[y,yo]].forEach(([el,ok])=>{el.disabled=true;el.style.borderColor=ok?'var(--ok)':'var(--bad)'});
  pts=(vo?2:0)+(xo?2:0)+(yo?1:0);total+=pts;
  mark(box,pts===5,`${pts}/5. Vertex (${e.vx[0]}, ${e.vx[1]}); x-intercept(s): ${e.xi.join(', ')}; y-intercept: ${e.yi}.`);
  const pt=[e.vx,...e.xi.map(a=>[a,0]),[0,e.yi]];
  box.querySelector('.sk').innerHTML=plot(e.fn,e.win,pt);
 });
 $('#score').textContent=`Score: ${total} / 35`;
 $('#chk').disabled=true;
 window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}
$('#chk').onclick=check;
$('#rst').onclick=()=>{build();window.scrollTo(0,0)};
build();
</script>
</body>
</html>
